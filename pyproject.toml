[project]
name = "citecheck"
version = "0.0.1"
description = "Citation integrity checker: scans academic papers for retracted, hallucinated, predatory, or misrepresented references."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Pierre Beaucoral", email = "pbeauco@gmail.com" },
]
keywords = ["citations", "retractions", "open-science", "meta-science", "academic-integrity"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[project.scripts]
citecheck = "citecheck.cli:app"

[project.urls]
Homepage = "https://github.com/pierrebeaucoral/citecheck"
Issues = "https://github.com/pierrebeaucoral/citecheck/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "respx>=0.21",
]
