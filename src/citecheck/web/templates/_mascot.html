{# Reusable coffee-person SVG mascot.

   Customizable parts use the `.cp-*` CSS classes; the wrapper's
   inline style is set by /static/mascot.js at page load from
   localStorage so user preferences are persisted client-side.

   Usage:  {% include "_mascot.html" %}
#}
<span class="coffee-person" aria-label="A small person sipping coffee">
  <svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">

    {# ---- Steam: three wavy circles rising above the cup ---- #}
    <g transform="translate(82, 50)">
      <circle class="cp-steam" cx="0"  cy="0" r="3" fill="#cbd5e1"/>
      <circle class="cp-steam" cx="6"  cy="0" r="2.5" fill="#cbd5e1"/>
      <circle class="cp-steam" cx="-5" cy="0" r="2" fill="#cbd5e1"/>
    </g>

    {# ---- Hair (background layer, behind face) ---- #}
    <ellipse class="cp-hair" cx="60" cy="38" rx="22" ry="20"/>
    <path class="cp-hair" d="M 38 40 Q 35 52 40 60 L 80 60 Q 85 52 82 40 Z"/>

    {# ---- Optional hat ---- #}
    <g class="cp-hat">
      <rect x="38" y="20" width="44" height="10" rx="2" fill="currentColor"/>
      <rect x="44" y="10" width="32" height="14" rx="3" fill="currentColor"/>
    </g>

    {# ---- Face (skin) ---- #}
    <ellipse class="cp-skin" cx="60" cy="48" rx="16" ry="18"/>

    {# ---- Eyes ---- #}
    <ellipse class="cp-eye" cx="54" cy="48" rx="2" ry="3" fill="#1a1d24"/>
    <ellipse class="cp-eye" cx="66" cy="48" rx="2" ry="3" fill="#1a1d24"/>

    {# ---- Mouth: subtle smile ---- #}
    <path d="M 55 56 Q 60 60 65 56" stroke="#1a1d24" stroke-width="1.5"
          stroke-linecap="round" fill="none"/>

    {# ---- Optional glasses ---- #}
    <g class="cp-glasses">
      <circle cx="54" cy="48" r="5" fill="none" stroke="#1a1d24" stroke-width="1.5"/>
      <circle cx="66" cy="48" r="5" fill="none" stroke="#1a1d24" stroke-width="1.5"/>
      <line x1="59" y1="48" x2="61" y2="48" stroke="#1a1d24" stroke-width="1.5"/>
    </g>

    {# ---- Body / shirt ---- #}
    <path class="cp-shirt"
          d="M 38 70 Q 38 65 45 65 L 75 65 Q 82 65 82 70 L 86 120 Q 86 130 78 130 L 42 130 Q 34 130 34 120 Z"/>

    {# ---- Right arm holding cup: grouped so it can rotate-sip ---- #}
    <g class="cp-arm-cup">
      {# arm #}
      <path class="cp-skin" d="M 75 78 Q 88 80 90 95 Q 90 100 86 100 Q 80 96 78 88 Z"/>
      {# cup body #}
      <rect class="cp-cup" x="78" y="60" width="16" height="14" rx="2"/>
      {# cup handle #}
      <path d="M 94 64 Q 100 64 100 68 Q 100 72 94 72"
            fill="none" stroke="currentColor" class="cp-cup" stroke-width="2"/>
      {# coffee surface #}
      <rect x="80" y="62" width="12" height="3" rx="1" fill="#3e1f0a"/>
    </g>

    {# ---- Left arm: rests by side ---- #}
    <path class="cp-skin" d="M 38 75 Q 32 90 33 105 Q 33 108 36 108 Q 40 100 42 85 Z"/>

  </svg>
</span>
