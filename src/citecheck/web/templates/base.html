<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.site_title if settings else 'citecheck' }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <h1><a href="/">{{ settings.site_title if settings else 'citecheck' }}</a></h1>
    <p class="tagline">{{ settings.site_tagline if settings else '' }}</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>
      <a href="https://github.com/pierrebeaucoral/citecheck" target="_blank" rel="noopener">Source code</a> ·
      <a href="/api/reports/{example_id}.json" onclick="return false" class="muted">JSON API</a> ·
      Apache-2.0
    </p>
  </footer>
</body>
</html>
