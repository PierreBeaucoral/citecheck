<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.site_title if settings else 'citecheck' }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <script src="/static/mascot.js" defer></script>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header>
    <div class="inner">
      <h1>
        <a href="/"><span class="logo" aria-hidden="true"></span> citecheck</a>
      </h1>
      <nav>
        <a href="/" {% if active_nav == 'home' %}class="active"{% endif %}>Check a PDF</a>
        <a href="/how" {% if active_nav == 'how' %}class="active"{% endif %}>How it works</a>
        <a href="/customize" {% if active_nav == 'customize' %}class="active"{% endif %}>Customize ☕</a>
        <a href="https://github.com/pierrebeaucoral/citecheck" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
    {% block subtitle %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div>
      <span class="badge">Apache-2.0</span>
      <span class="badge">No tracking</span>
      <span class="badge">Public reports</span>
    </div>
    <p style="margin-top: 0.5rem;">
      Built for academic use. Citecheck is not a substitute for editorial review.
    </p>
  </footer>
</body>
</html>
