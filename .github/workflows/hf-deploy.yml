# Auto-deploy citecheck to its HuggingFace Space on every push to main.
#
# Mechanism: HF Spaces are git repos.  We add the Space as a second
# remote and push main to it.  The Space then rebuilds the Docker image
# from the Dockerfile at its root (which is identical to ours).
#
# Required secrets (set in repo Settings -> Secrets and variables -> Actions):
#   HF_TOKEN  — a HuggingFace User Access Token with write access to the
#               target Space.  Generate at https://huggingface.co/settings/tokens
#               (role: "write" or "fine-grained" with write to Spaces).
#
# Required repo variables (Settings -> Secrets and variables -> Variables):
#   HF_USERNAME  — the HF user that owns the Space (e.g. "pierrebeaucoral").
#   HF_SPACE_NAME — the Space name (e.g. "citecheck").
#
# First-time setup: create the Space manually on HF (UI -> "New Space" ->
# SDK: Docker -> empty repo).  Subsequent pushes are handled by this job.

name: Deploy to HuggingFace Space

on:
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab for emergency redeploys.
  workflow_dispatch:

# Cancel previous in-flight deploys when a new push arrives — we only
# care about the latest main.
concurrency:
  group: hf-deploy
  cancel-in-progress: true

jobs:
  push-to-hf:
    name: Push main to HuggingFace Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          # HF rejects shallow pushes; we need the full history.
          fetch-depth: 0
          lfs: false

      - name: Sanity-check Dockerfile is present
        run: |
          if [[ ! -f Dockerfile ]]; then
            echo "::error::Dockerfile missing at repo root — HF Space build will fail."
            exit 1
          fi
          if [[ ! -f spaces/README.md ]]; then
            echo "::error::spaces/README.md missing — HF Space metadata header lives there."
            exit 1
          fi

      - name: Build orphan deploy commit + push to HuggingFace Space
        # HF Spaces' git server has a hard 10 MB per-file limit (LFS required
        # otherwise).  Our `main` history contains older revisions of
        # paper/main.pdf that exceed that limit, even though the current tip
        # is under.  We could rewrite history, but the Space genuinely does
        # not need paper/, data/eval/, quality_reports/, or tests/ at runtime.
        #
        # Approach: create an *orphan* branch (no parent commits → no history
        # → no big-blob blame) containing only deploy-relevant files, then
        # force-push that orphan as the Space's main branch.  GitHub's main
        # keeps the full history; HF gets a flat, slim, deploy-only mirror.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::HF_TOKEN secret not set."
            exit 1
          fi
          if [[ -z "$HF_USERNAME" || -z "$HF_SPACE_NAME" ]]; then
            echo "::error::HF_USERNAME or HF_SPACE_NAME repo variable not set."
            exit 1
          fi

          # ---- 1. Strip non-deploy directories from the working tree ----
          # These are large or irrelevant for the Space:
          #   paper/        — manuscript sources and the PDF
          #   data/         — eval corpora (PDFs, CSVs)
          #   quality_reports/ — plans, reports, internal notes
          #   tests/        — unit tests (runs in CI, not in the Space)
          #   docs/         — developer documentation
          # Keep: Dockerfile, src/, scripts/, pyproject.toml, uv.lock,
          # README (from spaces/), spaces/, .dockerignore.
          rm -rf paper data quality_reports tests docs

          # ---- 2. Substitute spaces/README.md as the root README ----
          # HF reads YAML frontmatter from the repo-root README.md.  Our
          # developer README doesn't have the frontmatter; spaces/README.md
          # does.
          cp spaces/README.md README.md

          # ---- 3. Build an orphan commit ----
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan hf-deploy
          # Re-stage the surviving tree; --orphan keeps files but resets the
          # index/HEAD ancestry.
          git add -A
          git commit -m "deploy: citecheck @ ${GITHUB_SHA::8}"

          # ---- 4. Force-push orphan as Space's main ----
          REMOTE_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          git remote add space "$REMOTE_URL" 2>/dev/null || \
            git remote set-url space "$REMOTE_URL"
          git push --force space hf-deploy:main
